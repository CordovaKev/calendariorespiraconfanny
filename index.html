<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Estratégico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURACIÓN: Reemplaza con tus credenciales reales de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAFBBNcRdK6wI0bOdb6PywJ275SV9uI7XU",
            authDomain: "calendar-rcf.firebaseapp.com",
            projectId: "calendar-rcf",
            storageBucket: "calendar-rcf.firebasestorage.app",
            messagingSenderId: "611172144830",
            appId: "1:611172144830:web:094c7e5f52b4c9d05df0ef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postsCol = collection(db, 'posts');

        // Estado básico
        let posts = [];

        // Inicializar
        onSnapshot(postsCol, (snapshot) => {
            posts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });

        window.guardarPost = async () => {
            const id = document.getElementById('pid').value || 'post_' + Date.now();
            const data = {
                titulo: document.getElementById('titulo').value,
                fecha: document.getElementById('fecha').value,
                contenido: document.getElementById('contenido').value
            };
            await setDoc(doc(db, 'posts', id), data);
            limpiarFormulario();
        };

        window.eliminarPost = async (id) => {
            await deleteDoc(doc(db, 'posts', id));
        };

        function render() {
            const lista = document.getElementById('lista-posts');
            lista.innerHTML = posts.map(p => `
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500 mb-2 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold">${p.titulo}</h3>
                        <p class="text-sm text-gray-500">${p.fecha}</p>
                    </div>
                    <button onclick="eliminarPost('${p.id}')" class="text-red-400 hover:text-red-600">Eliminar</button>
                </div>
            `).join('');
        }

        function limpiarFormulario() {
            document.getElementById('pid').value = '';
            document.getElementById('titulo').value = '';
            document.getElementById('fecha').value = '';
            document.getElementById('contenido').value = '';
        }
    </script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">Calendario de Contenidos</h1>
        
        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <input type="hidden" id="pid">
            <input type="text" id="titulo" placeholder="Título del Post" class="w-full p-2 mb-2 border rounded">
            <input type="date" id="fecha" class="w-full p-2 mb-2 border rounded">
            <textarea id="contenido" placeholder="Detalles del contenido..." class="w-full p-2 mb-4 border rounded"></textarea>
            <button onclick="guardarPost()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">Guardar Post</button>
        </div>

        <div id="lista-posts"></div>
    </div>
</body>
</html>
